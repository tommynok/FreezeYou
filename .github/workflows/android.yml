name: Android CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Needed to publish the build to Releases.
    permissions:
      contents: write
    env:
      JAVA_TOOL_OPTIONS: -XX:-UseContainerSupport
    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    # Replaces setup-java's `cache: gradle`, which only restores downloaded
    # dependencies. This also caches task outputs and the configuration cache,
    # and prunes stale entries so the cache does not grow without bound.
    # The two must not be combined; setup-java's gradle cache is removed above.
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        # Without this the cache is read-only on every branch except the default
        # one, so it is restored but never written and never actually speeds
        # anything up. Work here happens on non-default branches.
        cache-read-only: false

    # Cheap guard for a failure the compiler cannot see: a layout split across
    # res/layout/ and res/layout-vNN/ where only one copy got updated. The build
    # still succeeds and only the affected API level crashes at runtime.
    - name: Check layout variants
      run: python3 tools/check_layout_variants.py

    - name: Grant Permission
      run: chmod +x ./gradlew

    # Runs on the JVM, no device or emulator involved, so it costs seconds.
    # `test` is the anchor task that runs whichever unit test variants this AGP
    # version creates, rather than naming one that may not exist.
    - name: Unit tests
      run: |
        ./gradlew :app:tasks --all --console=plain | grep -i unittest || true
        ./gradlew test --stacktrace

    - name: Build with Gradle
      run: ./gradlew assembleRelease --stacktrace

    # A release carries the APK itself, so it installs straight from the phone's
    # browser. An artifact is a zip that has to be unpacked first, which is why
    # the release is what the summary links to.
    - name: Publish the APK to Releases
      id: release
      env:
        GH_TOKEN: ${{ github.token }}
        BUILD: ${{ github.run_number }}
      run: |
        set -euo pipefail
        apk="$(ls app/build/outputs/apk/release/*.apk | head -n 1)"
        name="FreezeYou-build${BUILD}.apk"
        cp "$apk" "$name"
        # The run number only ever grows, so the tag is unique without any bookkeeping.
        tag="build-${BUILD}"
        gh release create "$tag" "$name" \
          --target "${{ github.sha }}" \
          --title "Сборка ${BUILD}" \
          --notes "Ветка \`${{ github.ref_name }}\`, коммит ${{ github.sha }}."
        echo "url=$(gh release view "$tag" --json url --jq .url)" >> "$GITHUB_OUTPUT"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/*.apk

    - name: Add download link to job summary
      run: |
        echo "### 📦 [Сборка ${{ github.run_number }} в Releases](${{ steps.release.outputs.url }})" >> "$GITHUB_STEP_SUMMARY"
