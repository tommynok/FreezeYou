name: Android CI

# Manual only, matching the fork's own workflow. Upstream's push/pull_request
# triggers fired a run on every push — and a second, duplicate run whenever the
# branch also had an open pull request.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 18
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '18'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Replaces setup-java's `cache: gradle`, which only restores downloaded
      # dependencies. This also caches task outputs and the configuration cache,
      # and prunes stale entries so the cache does not grow without bound.
      # The two must not be combined; setup-java's gradle cache is removed above.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Without this the cache is read-only on every branch except the default
          # one, so it is restored but never written and never actually speeds
          # anything up. This branch is not the default branch.
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Upstream generates a throwaway keystore per run, which signs every build
      # differently and blocks reinstalling a newer preview APK over an older one.
      # Use the fork's checked-in debug key instead so preview builds install in place.
      - name: Build with Gradle
        env:
          CI_DEBUG_KEYSTORE: ${{ github.workspace }}/.github/ci/debug.keystore
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        id: upload-apk
        uses: actions/upload-artifact@v4
        with:
          name: app-preview-release
          path: app/build/outputs/apk/release/*.apk

      - name: Add download link to job summary
        run: |
          echo "### 📦 [Download app-preview-release.apk](${{ steps.upload-apk.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"
