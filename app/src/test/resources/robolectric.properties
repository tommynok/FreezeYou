# The API level a Robolectric test runs on when it does not ask for another one in @Config.
# Left to itself Robolectric takes the level from the merged manifest's targetSdk, which moves
# with the project rather than with the test. 34 is Android 14: new enough for the values-v31
# overlays, old enough to be well trodden by the framework's own tests.
sdk=34

# Why 23 is the oldest level a test may ask for: Robolectric dropped API 21 and 22 in 4.16.
# The project's minSdk 16 is below every level Robolectric supports, so the oldest range is
# covered by tools/check_theme_resolution.py and by the phone, not by these tests.
