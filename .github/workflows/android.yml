name: Android CI

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 18
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '18'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Upstream generates a throwaway keystore per run, which signs every build
      # differently and blocks reinstalling a newer preview APK over an older one.
      # Use the fork's checked-in debug key instead so preview builds install in place.
      - name: Build with Gradle
        env:
          CI_DEBUG_KEYSTORE: ${{ github.workspace }}/.github/ci/debug.keystore
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        id: upload-apk
        uses: actions/upload-artifact@v4
        with:
          name: app-preview-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Add download link to job summary
        run: |
          echo "### 📦 [Download app-preview-debug.apk](${{ steps.upload-apk.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"
