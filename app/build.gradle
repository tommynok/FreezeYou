apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'kotlin-parcelize'

// CI passes -PforkBuildNumber=<github.run_number>, so every build gets a strictly larger
// versionCode than the one before and versionName shows the same number as the release tag.
// The +100 offset exists because versionCode was hardcoded 151 while the run number was
// already 138 at the switch: Android refuses installs whose versionCode is lower than the
// installed one, so the first CI-numbered build had to land above 151. Locally, without the
// property, the old numbers stand.
def forkBuildNumber = (project.findProperty("forkBuildNumber") ?: "51").toInteger()
def effectiveVersionCode = forkBuildNumber + 100

android {
    compileSdk 37
    buildToolsVersion '32.0.0'
    defaultConfig {
        applicationId "cf.playhi.freezeyou"
        minSdkVersion 16
        targetSdk 32
        versionCode effectiveVersionCode
        versionName "11.5.${effectiveVersionCode}-fork"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        resConfigs "ru-rRU", "uk-rUA", "zh-rCN"
        ndk {
            // CI builds twice and publishes both APKs in one release: the default (universal,
            // arm64-v8a + armeabi-v7a, covers old 32-bit phones) and -PabiArm64Only=true
            // (arm64-v8a only, for modern devices). MMKV ships a v7a library, so the wider
            // filter costs under a megabyte and nothing else.
            def abis = (project.findProperty("abiArm64Only") == "true"
                    ? ['arm64-v8a']
                    : ['arm64-v8a', 'armeabi-v7a'])
            abiFilters(*abis)
        }
    }
    signingConfigs {
        debug {
            // Fixed, checked-in debug key so every build (CI or local) is signed identically
            // and installs in place over previous builds instead of conflicting.
            storeFile rootProject.file('.github/ci/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // The owner's real key, provided by CI through repository secrets (the workflow
            // decodes KEYSTORE_BASE64 into the file KEYSTORE_PATH points at). Intentionally
            // unconfigured here when the environment is absent - the buildTypes block then
            // falls back to the debug key so local builds keep working.
        }
    }
    buildTypes {
        release {
            def ksPath = System.getenv("KEYSTORE_PATH")
            // GitHub secrets preserve every pasted character; trailing whitespace from a
            // copy-paste would corrupt the passwords silently.
            def ksPassword = System.getenv("KEYSTORE_PASSWORD")?.trim()
            def alias = System.getenv("KEY_ALIAS")?.trim()
            def keyPwd = System.getenv("KEY_PASSWORD")?.trim()
            // KEY_PASSWORD is optional on purpose: PKCS12 writers handle the key password
            // differently (some ignore it entirely and encrypt the key with the store
            // password), so the build probes both candidates below and signs with whichever
            // decrypts the key. Mixing the two secrets up is therefore impossible to notice
            // and impossible to matter.
            def haveReleaseKey = ksPath != null && ksPassword != null && alias != null
                    && rootProject.file(ksPath).exists()
            if (ksPath != null && !haveReleaseKey) {
                // Secrets were expected (the workflow exports them) but the keystore file
                // did not materialize - signing with the debug key silently would be worse
                // than failing.
                throw new GradleException("KEYSTORE_PATH is set but ${ksPath} is missing; the release keystore was not decoded")
            }
            if (haveReleaseKey) {
                def ksFile = rootProject.file(ksPath)
                def keyStore = java.security.KeyStore.getInstance(ksFile, ksPassword.toCharArray())
                if (!keyStore.isKeyEntry(alias)) {
                    throw new GradleException("Alias '${alias}' is not a key entry in the release keystore")
                }
                def workingKeyPwd = null
                for (def candidate : [keyPwd, ksPassword].findAll { it != null }) {
                    try {
                        keyStore.getKey(alias, candidate.toCharArray())
                        workingKeyPwd = candidate
                        break
                    } catch (Exception ignored) {
                    }
                }
                if (workingKeyPwd == null) {
                    throw new GradleException("Neither KEY_PASSWORD nor KEYSTORE_PASSWORD decrypts the key '${alias}'. Fix the repository secrets.")
                }
                signingConfig signingConfigs.release
                signingConfigs.release {
                    storeFile ksFile
                    storePassword ksPassword
                    keyAlias alias
                    keyPassword workingKeyPwd
                }
            } else {
                signingConfig signingConfigs.debug
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            shrinkResources true
            minifyEnabled true
            zipAlignEnabled true
        }
    }
    productFlavors {
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    testOptions {
        unitTests {
            // Unit tests link against a stubbed android.jar whose methods throw by default.
            // Returning defaults instead lets a test stand up a Context and override only the
            // one method it needs, rather than pulling in a mocking library for it.
            returnDefaultValues = true
            // Robolectric inflates real layouts, so it needs the merged resources and the
            // generated R class on the unit test classpath. Without this every inflate() fails
            // with a missing resource and the layout test proves nothing.
            includeAndroidResources = true
        }
        // Robolectric reaches into the JDK's own packages (java.lang, java.io, java.net, ...),
        // and Java 17 and newer keep those closed unless asked. This is the list from the
        // Robolectric documentation. It applies to the plain JVM tests too, where it costs
        // nothing: they never open those packages.
        unitTests.all {
            // The full "Caused by:" chain of a failing test, in the log and therefore in the CI
            // job summary: for a layout that does not inflate, the first cause names the missing
            // resource or theme attribute, and the tail of the chain is noise.
            testLogging {
                exceptionFormat = 'full'
                events 'failed'
                showCauses = true
                showStackTraces = true
            }
            jvmArgs += [
                "--add-opens=java.base/java.lang=ALL-UNNAMED",
                "--add-opens=java.base/java.util=ALL-UNNAMED",
                "--add-opens=java.base/java.io=ALL-UNNAMED",
                "--add-opens=java.base/java.net=ALL-UNNAMED",
                "--add-opens=java.base/java.security=ALL-UNNAMED",
                "--add-opens=java.base/java.text=ALL-UNNAMED",
                "--add-opens=java.base/jdk.internal.access=ALL-UNNAMED",
                "--add-opens=java.desktop/java.awt.font=ALL-UNNAMED",
                "--add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED",
            ]
        }
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
    }

    bundle {
        language {
            enableSplit = false
        }
    }
    namespace 'cf.playhi.freezeyou'
    lint {
        abortOnError false
    }
}

dependencies {
    implementation fileTree(include: ['*.aar'], dir: 'libs') // Contains MMKV & Tray
    implementation 'com.getkeepsafe.relinker:relinker:1.4.5'

    implementation "androidx.activity:activity:1.4.0"
    implementation "androidx.activity:activity-ktx:1.4.0"
    implementation "androidx.annotation:annotation:1.3.0"

    def appcompat_version = "1.4.1"
    implementation "androidx.appcompat:appcompat:$appcompat_version"
    // For loading and tinting drawables on older versions of the platform
    implementation "androidx.appcompat:appcompat-resources:$appcompat_version"

    implementation "androidx.biometric:biometric:1.2.0-alpha04"

    def core_version = "1.7.0"
    implementation "androidx.core:core:$core_version"
    implementation "androidx.core:core-ktx:$core_version"

    def fragment_version = "1.4.1"
    implementation "androidx.fragment:fragment:$fragment_version"
    debugImplementation "androidx.fragment:fragment-testing:$fragment_version"

    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.4.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.4.1'

    implementation "androidx.preference:preference:1.2.0"

    implementation 'com.google.android.material:material:1.10.0'

    def shizuku_version = '12.2.0'
    implementation "dev.rikka.shizuku:api:$shizuku_version"
    implementation "dev.rikka.shizuku:provider:$shizuku_version"

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'

//    implementation 'com.google.zxing:core:3.3.3' 先把文本方式稳定下来，再做 QRCode

    testImplementation "junit:junit:4.13.2"
    // Runs the Android framework on the JVM, so layouts and themes can be inflated for real
    // without a device or an emulator (see LayoutThemeSmokeTest). 4.17 understands the
    // resources of compileSdk 37; 4.16 dropped API 21 and 22, so 23 is the oldest level a
    // Robolectric test may ask for.
    testImplementation "org.robolectric:robolectric:4.17"
}
