name: "CodeQL Security Analysis"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches: [ "feat/mmkv-migration", "stable-fork" ]
    paths-ignore:
      - '**.md'
      - 'tools/**'
      - '.github/workflows/android.yml'
      - '.github/workflows/font-asset-budget.yml'

jobs:
  analyze:
    name: CodeQL Security Audit (Java/Kotlin)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    env:
      JAVA_TOOL_OPTIONS: -XX:-UseContainerSupport

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: false

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: java-kotlin
        build-mode: manual

    - name: Build with Gradle for CodeQL tracing
      run: |
        chmod +x ./gradlew
        ./gradlew assembleRelease -PforkBuildNumber=500 --no-daemon

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:java-kotlin"
