name: Android CI

on:
  # The owner starts a build from the Actions page. Pushing a `ci-*` tag starts one too: that is
  # how a machine (or a terminal, or the agent working on this branch) asks for a build without
  # the Actions permission, which an installation token does not have. A tag run is an ordinary
  # run - same tests, same two APKs, same release - and the tag itself is disposable.
  workflow_dispatch:
  push:
    tags:
      - 'ci-*'

jobs:
  build:
    runs-on: ubuntu-latest
    # Needed to publish the build to Releases.
    permissions:
      contents: write
    env:
      JAVA_TOOL_OPTIONS: -XX:-UseContainerSupport
    steps:
    - uses: actions/checkout@v4

    # The owner's release key, stored as a base64 repository secret. When the secret is
    # absent (e.g. a fork running its own dispatch) the build falls back to the checked-in
    # debug key; when it is present, both APKs in the release are release-signed.
    - name: Prepare the release keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > release-keystore.jks
          if [ ! -s release-keystore.jks ]; then
            echo "::error::KEYSTORE_BASE64 decoded to an empty file - check the secret"
            exit 1
          fi
          echo "Release keystore decoded ($(wc -c < release-keystore.jks) bytes)."
        else
          echo "KEYSTORE_BASE64 is not set; falling back to the debug key."
        fi

    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    # Replaces setup-java's `cache: gradle`, which only restores downloaded
    # dependencies. This also caches task outputs and the configuration cache,
    # and prunes stale entries so the cache does not grow without bound.
    # The two must not be combined; setup-java's gradle cache is removed above.
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        # Without this the cache is read-only on every branch except the default
        # one, so it is restored but never written and never actually speeds
        # anything up. Work here happens on non-default branches.
        cache-read-only: false

    # Cheap guard for a failure the compiler cannot see: a layout split across
    # res/layout/ and res/layout-vNN/ where only one copy got updated. The build
    # still succeeds and only the affected API level crashes at runtime.
    - name: Check layout variants
      run: python3 tools/check_layout_variants.py

    - name: Grant Permission
      run: chmod +x ./gradlew

    # Robolectric downloads one android-all jar per API level it runs on (tens of megabytes),
    # into the Maven cache rather than into Gradle's. Without this step every run pays for the
    # download again; with it only the first run after a version bump does.
    - name: Cache Robolectric jars
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository/org/robolectric
        key: robolectric-${{ runner.os }}-4.17

    # Runs on the JVM, no device or emulator involved. Most of it costs seconds; the layout
    # test under Robolectric adds the resource build and, on a cache miss, that download.
    # `test` is the anchor task that runs whichever unit test variants this AGP
    # version creates, rather than naming one that may not exist.
    #
    # A failure prints itself into the job summary as well as into the log: the summary is what
    # the run page shows first, it is readable through the API on a machine where the log
    # download host is unreachable, and it is what a person actually looks at on a phone.
    - name: Unit tests
      run: |
        ./gradlew :app:tasks --all --console=plain | grep -i unittest || true
        set +e
        ./gradlew test --stacktrace 2>&1 | tee unit-tests.log
        status=${PIPESTATUS[0]}
        set -e
        # What the geometry tests measured, as notices: annotations come back through the API on
        # a machine where the log download host is unreachable, and notices appear on green runs
        # too, so a fix can be confirmed by numbers instead of by a screenshot.
        grep -h "^GEOM:" unit-tests.log | head -20 | while IFS= read -r line; do
          echo "::notice title=Measured geometry::${line#GEOM: }"
        done || true

        if [ "$status" -ne 0 ]; then
          # The essentials go out as an annotation as well as into the summary. Annotations are
          # the one channel that comes back through the API on a machine where the log download
          # host is unreachable, which is how the reason for this very failure was found.
          # Newlines have to be escaped for a workflow command (%0A), and % itself first (%25).
          # Gradle indents a failure's message, so the patterns allow leading whitespace: written
          # as ^FAIL: this matched nothing but the framework's own Caused by: line, and a red run
          # said only "the test failed" without saying why.
          report=$(grep -E "^[[:space:]]*(FAIL:|AssertionError|Caused by:)|requires your app theme|InflateException|NotFoundException|ClassNotFound|NoClassDefFound" \
            unit-tests.log | head -40 || true)
          [ -z "$report" ] && report=$(grep -E "FAILED|error:|What went wrong|Could not" unit-tests.log | head -20 || true)
          # Last resort: the failure block itself, indentation and all.
          [ -z "$report" ] && report=$(grep -A 20 -m1 "FAILED" unit-tests.log | head -25 || true)
          report=$(printf '%s' "$report" | sed -e 's/%/%25/g' -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g')
          echo "::error title=Unit test details::${report:0:60000}"
          {
            echo "## Unit tests failed"
            echo
            echo "Failing tests and first exceptions:"
            echo '```'
            grep -E "FAILED|AssertionError|Exception|Caused by:|error:|e: |What went wrong|Could not|Unresolved" \
              unit-tests.log | head -80 || true
            echo '```'
            echo "<details><summary>Last 150 lines of the log</summary>"
            echo
            echo '```'
            tail -150 unit-tests.log || true
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          # A one-line pointer as an annotation, so the failure is visible on the run page too.
          # Every command here is allowed to fail: the summary is worth writing even when the
          # log has nothing that matches these patterns.
          first=$(grep -m1 -E "FAILED|AssertionError|error:|What went wrong" unit-tests.log | cut -c1-180 || true)
          echo "::error title=Unit tests failed::${first:-see the job summary}"
          exit 1
        fi

    # Two builds, one release. forkBuildNumber is the run number: it makes versionCode grow
    # by one every build, so an update always installs over the previous one. The universal
    # APK (arm64-v8a + armeabi-v7a) covers old 32-bit phones; the arm64 one is for modern
    # devices that want the smaller file. Both carry the same versionCode, so either
    # installs as an update over the other.
    - name: Build universal APK (arm64-v8a + armeabi-v7a)
      env:
        BUILD: ${{ github.run_number }}
        KEYSTORE_PATH: release-keystore.jks
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      run: |
        ./gradlew assembleRelease -PforkBuildNumber=${{ github.run_number }} --stacktrace
        cp app/build/outputs/apk/release/app-release.apk "FreezeYou-build${BUILD}-universal.apk"

    - name: Build arm64-only APK
      env:
        BUILD: ${{ github.run_number }}
        KEYSTORE_PATH: release-keystore.jks
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      run: |
        ./gradlew clean assembleRelease -PforkBuildNumber=${{ github.run_number }} -PabiArm64Only=true --stacktrace
        cp app/build/outputs/apk/release/app-release.apk "FreezeYou-build${BUILD}-arm64.apk"

    # A release carries the APKs themselves, so they install straight from the phone's
    # browser. An artifact is a zip that has to be unpacked first, which is why
    # the release is what the summary links to.
    - name: Publish the APKs to Releases
      id: release
      env:
        GH_TOKEN: ${{ github.token }}
        BUILD: ${{ github.run_number }}
      run: |
        set -euo pipefail
        # The run number only ever grows, so the tag is unique without any bookkeeping.
        tag="build-${BUILD}"
        gh release create "$tag" \
          "FreezeYou-build${BUILD}-arm64.apk" \
          "FreezeYou-build${BUILD}-universal.apk" \
          --target "${{ github.sha }}" \
          --title "Build ${BUILD}" \
          --notes "Branch \`${{ github.ref_name }}\`, commit ${{ github.sha }}."
        echo "url=$(gh release view "$tag" --json url --jq .url)" >> "$GITHUB_OUTPUT"

    - name: Upload APKs
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: |
          FreezeYou-build*-arm64.apk
          FreezeYou-build*-universal.apk

    - name: Add download link to job summary
      run: |
        echo "### 📦 [Build ${{ github.run_number }} in Releases](${{ steps.release.outputs.url }})" >> "$GITHUB_STEP_SUMMARY"
